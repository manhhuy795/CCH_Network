<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise Full-SDN architecture</title>
  <desc id="desc">Five-level enterprise architecture with an OS-Ken controller, firewalls and Internet services, HQ and Branch forwarding, VLAN 93 primary and backup paths, six Open vSwitches, and endpoint groups.</desc>
  <defs>
    <style>
      text { font-family: Inter, "Segoe UI", system-ui, sans-serif; }
      .title { font-size: 30px; font-weight: 750; fill: #172033; }
      .subtitle { font-size: 15px; font-weight: 550; fill: #526079; }
      .section { font-size: 16px; font-weight: 750; fill: #c2410c; letter-spacing: .7px; }
      .label { font-size: 16px; font-weight: 750; fill: #172033; }
      .small { font-size: 14px; font-weight: 500; fill: #526079; }
      .note { font-size: 12px; font-weight: 550; fill: #667085; }
      .canvas { fill: #ffffff; }
      .band { fill: #f8fafc; stroke: #d8dee9; stroke-width: 1.2; }
      .controller { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.2; }
      .ovs { fill: #ffffff; stroke: #2563eb; stroke-width: 2; }
      .firewall { fill: #fff1f2; stroke: #be123c; stroke-width: 1.8; }
      .external { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.8; }
      .endpoint { fill: #ffffff; stroke: #98a2b3; stroke-width: 1.3; }
      .project93 { fill: #ecfdf3; stroke: #16865c; stroke-width: 1.7; }
      .infra { fill: #fffbeb; stroke: #b7791f; stroke-width: 1.6; }
      .wan { fill: none; stroke: #cbd5e1; stroke-width: 1.3; stroke-dasharray: 6 5; }
      .primary-box { fill: #ecfdf3; stroke: #16865c; stroke-width: 1.8; }
      .backup-box { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.8; stroke-dasharray: 7 5; }
      .pill { fill: #ffffff; stroke: #d8dee9; stroke-width: 1.1; }
      .control { fill: none; stroke: #2563eb; stroke-width: 1.2; stroke-dasharray: 5 5; opacity: .42; }
      .data { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; }
      .external-link { fill: none; stroke: #c2410c; stroke-width: 2.2; stroke-linejoin: round; }
      .routed { fill: none; stroke: #0f766e; stroke-width: 2.2; stroke-dasharray: 8 5; stroke-linejoin: round; }
      .primary { fill: none; stroke: #16865c; stroke-width: 3; stroke-linejoin: round; }
      .backup { fill: none; stroke: #7c3aed; stroke-width: 3; stroke-dasharray: 9 6; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1440" height="900" class="canvas"/>
  <text x="720" y="34" text-anchor="middle" class="title">ENTERPRISE FULL-SDN ARCHITECTURE</text>
  <text x="720" y="59" text-anchor="middle" class="subtitle">6 OVS · OS-Ken · OpenFlow 1.3 · Pipeline 0 → 10 → 20 → 30 · No OFPP_NORMAL</text>

  <!-- Row 1: controller -->
  <rect x="500" y="82" width="440" height="66" rx="13" class="controller"/>
  <text x="720" y="109" text-anchor="middle" class="label">OS-KEN SDN CONTROLLER</text>
  <text x="720" y="132" text-anchor="middle" class="small">OpenFlow 1.3 · tcp:127.0.0.1:6653 · 6 controlled OVS</text>

  <!-- Connector legend and dedicated control-plane routing bus -->
  <path d="M720 148 V178 H25 M720 178 H1415" class="control"/>
  <path d="M25 178 V550 H50 M450 178 V385 H420 M510 178 V550 H500 M930 178 V550 H780 M990 178 V385 H1020 M1415 178 V550 H1270" class="control"/>
  <line x1="505" y1="190" x2="545" y2="190" class="control"/>
  <text x="553" y="194" class="note">Control plane</text>
  <line x1="665" y1="190" x2="705" y2="190" class="data"/>
  <text x="713" y="194" class="note">Data plane</text>
  <line x1="815" y1="190" x2="855" y2="190" class="primary"/>
  <text x="863" y="194" class="note">VLAN 93 WAN</text>

  <text x="30" y="214" class="section">HQ</text>
  <text x="1410" y="214" text-anchor="end" class="section">BRANCH</text>

  <!-- Long-haul links use routing lanes; short hierarchy branches stay direct. -->
  <!-- Row 2: firewalls and external services -->
  <path d="M320 250 H600 M840 250 H1120" class="external-link"/>
  <path d="M160 278 V326 H300 V350 M1280 278 V326 H1140 V350" class="data"/>
  <path d="M240 278 V310 H560 M880 310 H1200 V278" class="routed"/>

  <!-- Row 3: VLAN 93 Primary/Backup -->
  <path d="M420 370 H560 M880 370 H1020" class="primary"/>
  <path d="M420 400 H540 V426 H560 M880 426 H940 V400 H1020" class="backup"/>

  <!-- Row 3 to row 4: internal OVS fabric -->
  <path d="M240 420 L155 520 M300 420 L395 520 M360 420 L675 520 M1140 420 L1165 520" class="data"/>

  <!-- Row 4 to row 5: endpoint attachment -->
  <path d="M120 580 L85 690 M205 580 L230 690 M340 580 L375 690 M400 580 L495 690 M465 580 L635 690 M675 580 L805 690 M1120 580 L1065 690 M1210 580 L1295 690" class="data"/>

  <rect x="80" y="225" width="240" height="53" rx="10" class="firewall"/>
  <text x="200" y="248" text-anchor="middle" class="label">FIREWALL HQ</text>
  <text x="200" y="267" text-anchor="middle" class="small">nftables boundary</text>

  <rect x="600" y="225" width="240" height="53" rx="10" class="external"/>
  <text x="720" y="248" text-anchor="middle" class="label">INTERNET / PARTNER</text>
  <text x="720" y="267" text-anchor="middle" class="small">CRM · PBX / Contact Center</text>

  <rect x="1120" y="225" width="240" height="53" rx="10" class="firewall"/>
  <text x="1240" y="248" text-anchor="middle" class="label">FIREWALL BRANCH</text>
  <text x="1240" y="267" text-anchor="middle" class="small">nftables boundary</text>

  <rect x="560" y="293" width="320" height="34" rx="17" class="pill"/>
  <text x="720" y="315" text-anchor="middle" class="small">IPv4 routed intersite abstraction</text>

  <!-- Row 3: core, WAN, distribution -->
  <rect x="180" y="350" width="240" height="70" rx="11" class="ovs"/>
  <text x="300" y="378" text-anchor="middle" class="label">core_hq</text>
  <text x="300" y="400" text-anchor="middle" class="small">OVS · DPID 3 · L2/L3 gateway</text>

  <rect x="520" y="338" width="400" height="112" rx="12" class="wan"/>
  <rect x="560" y="352" width="320" height="36" rx="18" class="primary-box"/>
  <text x="720" y="375" text-anchor="middle" class="label">VLAN 93 PRIMARY · ACTIVE</text>
  <rect x="560" y="408" width="320" height="36" rx="18" class="backup-box"/>
  <text x="720" y="431" text-anchor="middle" class="label">VLAN 93 BACKUP · STANDBY</text>
  <text x="720" y="466" text-anchor="middle" class="note">Automatic attachment-link failover · CE/L2VPN abstraction</text>

  <rect x="1020" y="350" width="240" height="70" rx="11" class="ovs"/>
  <text x="1140" y="378" text-anchor="middle" class="label">dist_branch</text>
  <text x="1140" y="400" text-anchor="middle" class="small">OVS · DPID 5 · Branch L3</text>

  <!-- Row 4: access and infrastructure OVS -->
  <rect x="50" y="520" width="210" height="60" rx="10" class="ovs"/>
  <text x="155" y="545" text-anchor="middle" class="label">access_floor1</text>
  <text x="155" y="565" text-anchor="middle" class="small">DPID 1 · V93/101/120/140</text>

  <rect x="290" y="520" width="210" height="60" rx="10" class="ovs"/>
  <text x="395" y="545" text-anchor="middle" class="label">access_floor2</text>
  <text x="395" y="565" text-anchor="middle" class="small">DPID 2 · V103/104/110</text>

  <rect x="570" y="520" width="210" height="60" rx="10" class="ovs"/>
  <text x="675" y="545" text-anchor="middle" class="label">infra_access</text>
  <text x="675" y="565" text-anchor="middle" class="small">DPID 6 · VLAN 100</text>

  <rect x="1060" y="520" width="210" height="60" rx="10" class="ovs"/>
  <text x="1165" y="545" text-anchor="middle" class="label">access_branch</text>
  <text x="1165" y="565" text-anchor="middle" class="small">DPID 4 · VLAN 50/93</text>

  <!-- Row 5: endpoint groups -->
  <rect x="30" y="690" width="110" height="82" rx="9" class="endpoint"/>
  <text x="85" y="719" text-anchor="middle" class="label">PROJECT 1</text>
  <text x="85" y="742" text-anchor="middle" class="small">20 users</text>
  <text x="85" y="759" text-anchor="middle" class="note">VLAN 101</text>

  <rect x="150" y="690" width="160" height="82" rx="9" class="project93"/>
  <text x="230" y="719" text-anchor="middle" class="label">PROJECT 2 · HQ</text>
  <text x="230" y="742" text-anchor="middle" class="small">10 users · VLAN 93</text>
  <text x="230" y="759" text-anchor="middle" class="note">Gateway at HQ</text>

  <rect x="320" y="690" width="110" height="82" rx="9" class="endpoint"/>
  <text x="375" y="719" text-anchor="middle" class="label">PROJECT 3</text>
  <text x="375" y="742" text-anchor="middle" class="small">20 users</text>
  <text x="375" y="759" text-anchor="middle" class="note">VLAN 103</text>

  <rect x="440" y="690" width="110" height="82" rx="9" class="endpoint"/>
  <text x="495" y="719" text-anchor="middle" class="label">PROJECT 4</text>
  <text x="495" y="742" text-anchor="middle" class="small">20 users</text>
  <text x="495" y="759" text-anchor="middle" class="note">VLAN 104</text>

  <rect x="560" y="690" width="150" height="82" rx="9" class="endpoint"/>
  <text x="635" y="716" text-anchor="middle" class="label">IT / GUEST / IoT</text>
  <text x="635" y="739" text-anchor="middle" class="small">IT: 10 users · V110</text>
  <text x="635" y="758" text-anchor="middle" class="note">Guest V120 · IoT V140</text>

  <rect x="720" y="690" width="170" height="82" rx="9" class="infra"/>
  <text x="805" y="716" text-anchor="middle" class="label">INFRASTRUCTURE</text>
  <text x="805" y="739" text-anchor="middle" class="small">VLAN 100</text>
  <text x="805" y="758" text-anchor="middle" class="note">DHCP · DNS · AD · NMS</text>

  <rect x="960" y="690" width="210" height="82" rx="9" class="project93"/>
  <text x="1065" y="716" text-anchor="middle" class="label">PROJECT 2 · BRANCH</text>
  <text x="1065" y="739" text-anchor="middle" class="small">10 users · VLAN 93</text>
  <text x="1065" y="758" text-anchor="middle" class="note">No Branch SVI</text>

  <rect x="1190" y="690" width="210" height="82" rx="9" class="endpoint"/>
  <text x="1295" y="716" text-anchor="middle" class="label">BRANCH IoT</text>
  <text x="1295" y="739" text-anchor="middle" class="small">2 endpoints · VLAN 50</text>
  <text x="1295" y="758" text-anchor="middle" class="note">Least-privilege segment</text>

  <rect x="30" y="810" width="1370" height="44" rx="12" class="band"/>
  <text x="720" y="829" text-anchor="middle" class="small">Explicit L2/L3 forwarding · OpenFlow VLAN push/pop · default-deny / least privilege</text>
  <text x="720" y="847" text-anchor="middle" class="note">90 corporate users · 7 infrastructure services · IPv4-only · attachment-link failover · external abstractions outside OpenFlow</text>
</svg>
