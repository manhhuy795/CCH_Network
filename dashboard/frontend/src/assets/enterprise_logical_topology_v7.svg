<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="880" viewBox="0 0 1900 880">
  <defs>
    <style>
      text { font-family: Outfit, "Segoe UI", system-ui, sans-serif; }
      .title { font-size: 30px; font-weight: 700; fill: var(--text, #161616); }
      .subtitle { font-size: 15px; font-weight: 500; fill: var(--text-muted, #56534e); }
      .site-title { font-size: 21px; font-weight: 700; fill: var(--primary, #ca4810); }
      .label { font-size: 13px; font-weight: 700; fill: var(--text, #161616); }
      .small { font-size: 11px; font-weight: 500; fill: var(--text-muted, #56534e); }
      .tiny { font-size: 10px; font-weight: 500; fill: var(--text-muted, #56534e); }
      .site { fill: var(--surface, #ffffff); stroke: var(--primary, #ca4810); stroke-width: 2; }
      .group { fill: var(--surface, #ffffff); stroke: var(--border, #e9e7e2); stroke-width: 1.4; }
      .fw-group { fill: var(--surface, #ffffff); stroke: var(--danger, #b8322e); stroke-width: 1.8; }
