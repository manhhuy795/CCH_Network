      .firewall { fill: var(--surface, #ffffff); stroke: var(--danger, #b8322e); stroke-width: 2; }
      .access { fill: var(--surface, #ffffff); stroke: var(--text-muted, #56534e); stroke-width: 1.5; }
      .shared { fill: var(--surface, #ffffff); stroke: var(--success, #137452); stroke-width: 1.8; }
      .partner { fill: var(--surface, #ffffff); stroke: var(--warning, #9a4d09); stroke-width: 1.8; }
      .wan-primary { fill: var(--surface, #ffffff); stroke: var(--primary, #ca4810); stroke-width: 2; }
      .wan-backup { fill: var(--surface, #ffffff); stroke: var(--primary, #ca4810); stroke-width: 2; stroke-dasharray: 9 6; }
      .normal-link { stroke: var(--text-muted, #56534e); stroke-width: 2; fill: none; }
      .lan-link { stroke: var(--primary, #ca4810); stroke-width: 2; fill: none; }
      .ha-link { stroke: var(--danger, #b8322e); stroke-width: 1.8; stroke-dasharray: 7 5; fill: none; }
      .inter-switch { stroke: var(--text-muted, #56534e); stroke-width: 2.2; fill: none; }
      .l2-handoff { stroke: var(--primary, #ca4810); stroke-width: 2.4; fill: none; }
      .ipsec-link { stroke: var(--success, #137452); stroke-width: 2.5; stroke-dasharray: 10 7; fill: none; }
      .mpls-primary { stroke: var(--primary, #ca4810); stroke-width: 2.6; fill: none; }
      .mpls-backup { stroke: var(--primary, #ca4810); stroke-width: 2.6; stroke-dasharray: 10 7; fill: none; }
