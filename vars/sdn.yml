sdn:
  enabled: true
  controller:
    type: generic_rest
    url_env: SDN_CONTROLLER_URL
    username_env: SDN_USERNAME
    password_env: SDN_PASSWORD
    api_path: /api/v1/network-intents
  fabric_scope:
    - hq-core-dist
    - hq-access-a
    - hq-access-b
    - hq-infra-access
    - br-core-dist
    - br-access
  protected_boundaries:
    - name: mpls_l2vpn
      rule: "Do not program the provider PE/P core. SDN controls only the enterprise OVS/LAN edge; CE/MPLS bridges are unmanaged transport abstractions."
    - name: ipsec_l3_abstraction
      rule: "The lab models routed intersite reachability between the two firewall abstractions through ipsec_l3 but does not claim IKE, ESP, XFRM or cryptographic IPsec evidence."
    - name: firewall_internet_breakout
      rule: "Internet and partner-service enforcement remains on the local nftables firewall abstraction."
  intents:
    - name: isolate-project-1
      type: segmentation
      source_vlan: 101
      deny_destination_vlans: [93, 103, 104]
      allowed_services: [dhcp, dns, ad, file, ntp]
      enforcement: acl_or_group_policy
      log: true
    - name: isolate-project-2
      type: segmentation
      source_vlan: 93
      deny_destination_vlans: [101, 103, 104]
      allowed_services: [dhcp, dns, ad, file, ntp]
      enforcement: acl_or_group_policy
      log: true
    - name: isolate-project-3
      type: segmentation
      source_vlan: 103
      deny_destination_vlans: [93, 101, 104]
      allowed_services: [dhcp, dns, ad, file, ntp]
      enforcement: acl_or_group_policy
      log: true
    - name: isolate-project-4
      type: segmentation
      source_vlan: 104
      deny_destination_vlans: [93, 101, 103]
      allowed_services: [dhcp, dns, ad, file, ntp]
      enforcement: acl_or_group_policy
      log: true
    - name: hq-iot-limited
      type: segmentation
      source_vlan: 140
      allowed_services: [dhcp, dns, ntp, monitoring]
      deny_internal: true
      enforcement: acl_or_group_policy
      log: true
    - name: guest-internet-only
      type: segmentation
      source_vlan: 120
      allowed_services: [dhcp, dns, ntp, general_internet]
      deny_internal: true
      enforcement: acl_or_group_policy
      log: true
    - name: branch-iot-limited
      type: segmentation
      source_vlan: 50
      deny_destination_vlans: [93]
      allowed_services: [dhcp, dns, ntp, monitoring]
      enforcement: acl_or_group_policy
      log: true
    - name: vlan93-l2-extension
      type: l2_service_boundary
      source_vlan: 93
      sites: [hq, branch]
      gateway_site: hq
      branch_svi: false
      primary_transport: l2vpn_primary
      backup_transport: l2vpn_backup
      enforcement: transport_contract
      log: true
    - name: internet-policy-steering
      type: service_insertion
      source_vlans: [93, 101, 103, 104, 110, 120]
      next_service: firewall
      policy_reference: firewall_policy
      enforcement: route_or_pbr_to_firewall
      log: true
