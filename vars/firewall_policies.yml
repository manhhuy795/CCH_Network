firewall_policy:
  runtime_defaults:
    engine: nftables
    family: inet
    table_name: cch_filter
    input_policy: drop
    forward_policy: drop
    output_policy: accept
    chain_priority: 0
    allow_established_related: true
    drop_invalid: true
    counter_enabled: true
    drop_log_prefix: "CCH_FW_DROP"
    drop_log_rate: "10/second"
    nat:
      enabled: false
      mode: routed_lab
      runtime_verification_required: true
      reason: "Mininet uses routed service simulators. Production NAT depends on the real ISP/firewall design."
  shared_objects:
    applications:
      partner_pbx: {runtime_service: h90, type: partner_service, ports: [tcp/5060, tcp/5061, udp/10000-20000]}
      partner_crm: {runtime_service: hcall, type: partner_service, ports: [tcp/443]}
      internet_app: {runtime_service: hzalo, type: internet_placeholder, ports: [tcp/443]}
      social_media: {runtime_service: hsocial, type: category}
      general_internet: {runtime_service: hinternet, type: simulation}
  sites:
    hq:
      firewall_name: fw_hq
      site: hq
      inside_node: core_hq
      outside_node: internet_zone
      tunnel_node: ipsec_l3
      design_redundancy: active_standby
      design_members: [fw_hq1, fw_hq2]
      outside_circuits: [primary, backup]
      runtime_note: "One nftables namespace represents the active firewall HA cluster in Mininet. The tunnel interface is a routed IPsec abstraction, not cryptographic evidence."
      inside_interface: inside
      outside_interface: outside
      tunnel_interface: tunnel
      runtime_interfaces: {inside: fw_hq-eth0, outside: fw_hq-eth1, tunnel: fw_hq-eth2}
      owned_subnets: [10.10.93.0/24, 10.10.100.0/24, 10.10.101.0/24, 10.10.103.0/24, 10.10.104.0/24, 10.10.110.0/24, 10.10.120.0/24, 10.10.140.0/24]
      remote_subnets: [10.20.50.0/24]
      policies:
        - {name: allow-partner-pbx, action: allow, sources: [93, 101, 103, 104, 110], destinations: [internet], applications: [partner_pbx], enable_flag: allow_voice, log: true}
        - {name: allow-call-app, action: allow, sources: [93, 101, 103, 104, 110], destinations: [internet], applications: [partner_crm], enable_flag: allow_call_app, log: true}
        - {name: allow-zalo, action: allow, sources: [93, 101, 103, 104, 110], destinations: [internet], applications: [internet_app], enable_flag: allow_zalo, log: true}
        - {name: deny-social-media, action: deny, sources: [93, 101, 103, 104, 110, 120], destinations: [internet], applications: [social_media], enable_flag: block_social_media, log: true}
        - {name: allow-general-internet, action: allow, sources: [93, 101, 103, 104, 110], destinations: [internet], applications: [general_internet], enable_flag: allow_general_internet, log: true}
        - {name: allow-guest-internet, action: allow, sources: [120], destinations: [internet], applications: [general_internet], enable_flag: allow_guest_general_internet, log: true}
    branch:
      firewall_name: fw_telesale
      site: branch
      inside_node: dist_branch
      outside_node: internet_zone
      tunnel_node: ipsec_l3
      design_redundancy: active_standby
      design_members: [fw_br1, fw_br2]
      outside_circuits: [primary, backup]
      runtime_note: "One nftables namespace represents the active firewall HA cluster in Mininet. VLAN 93 uses its HQ gateway and therefore exits through HQ, not this firewall."
      inside_interface: inside
      outside_interface: outside
      tunnel_interface: tunnel
      runtime_interfaces: {inside: fw_tel-eth0, outside: fw_tel-eth1, tunnel: fw_tel-eth2}
      owned_subnets: [10.20.50.0/24]
      remote_subnets: [10.10.100.0/24, 10.10.101.0/24, 10.10.103.0/24, 10.10.104.0/24, 10.10.110.0/24, 10.10.120.0/24, 10.10.140.0/24]
      policies:
        - {name: deny-social-media, action: deny, sources: [50], destinations: [internet], applications: [social_media], enable_flag: block_social_media, log: true}
