l2vpn_services:
  vlan93_project_2:
    service_type: vpws
    ethernet_service: e_line
    customer_vlan: 93
    subnet: 10.10.93.0/24
    gateway: 10.10.93.1
    gateway_site: hq
    gateway_node: core_hq
    sites: [hq, branch]
    primary: {runtime_node: l2vpn_primary, hq_ce: ce_hq1, branch_ce: ce_branch1, state: active}
    backup: {runtime_node: l2vpn_backup, hq_ce: ce_hq2, branch_ce: ce_branch2, state: standby}
    runtime_mode: transparent_linux_bridge
    limitations: "No PE/P routers, labels, LDP/RSVP or provider signaling are simulated. Backup attachment ports stay down until failover is requested."

