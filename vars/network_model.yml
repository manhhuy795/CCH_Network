metadata:
  name: "CCH Enterprise Logical Topology v7"
  description: "HQ + 1 Branch, collapsed Core/Distribution, VLAN 93 stretched by MPLS L2VPN, local Internet breakout and logical IPsec L3 intersite transport between site firewalls."
  architecture: "2-tier Collapsed Core / Distribution"
  openflow_version: "1.3"
  controller: "127.0.0.1:6653"
  design_diagram: "docs/assets/enterprise_logical_topology_v7.svg"
  runtime_note: "Mininet keeps one logical OVS per HA Core/Distribution pair and one nftables namespace per firewall HA pair. IPsec is a routed tunnel abstraction between the firewall namespaces without IKE/XFRM encryption. MPLS L2VPN primary/backup is Ethernet transport logic, not a provider PE/P control plane."
  runtime_scale_note: "The deterministic lab runtime contains 90 corporate users; Project 2 has 10 endpoints at HQ and 10 at Branch."

