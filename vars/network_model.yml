  access_floor2: {label: "HQ Access B", role: access, site: hq, controlled: true, dpid: "0000000000000002"}
  core_hq: {label: "CORE-DIST HQ - Logical HA Pair", role: collapsed_core_distribution, site: hq, controlled: true, dpid: "0000000000000003"}
  access_branch: {label: "Branch Access", role: access, site: branch, controlled: true, dpid: "0000000000000004"}
  dist_branch: {label: "CORE-DIST Branch - Logical HA Pair", role: collapsed_core_distribution, site: branch, controlled: true, dpid: "0000000000000005"}
  infra_access: {label: "Server / Infrastructure Access", role: infrastructure_access, site: hq, controlled: true, dpid: "0000000000000006"}

infrastructure:
  c0: {label: "OS-Ken SDN Controller", type: controller, site: hq}
  ce_hq1: {label: "CE-HQ1", type: ce_bridge, site: hq, path_role: primary}
  ce_hq2: {label: "CE-HQ2", type: ce_bridge, site: hq, path_role: backup}
  ce_branch1: {label: "CE-BR1", type: ce_bridge, site: branch, path_role: primary}
  ce_branch2: {label: "CE-BR2", type: ce_bridge, site: branch, path_role: backup}
  l2vpn_primary: {label: "MPLS L2VPN Primary", type: l2vpn, site: wan, state: active, runtime_name: l2vpn93p}
  l2vpn_backup: {label: "MPLS L2VPN Backup", type: l2vpn, site: wan, state: standby, runtime_name: l2vpn93b}
  ipsec_l3: {label: "IPsec L3 VPN Logic", type: ipsec, site: wan, runtime_mode: routed_tunnel_abstraction_between_firewalls, cryptographic_ipsec: false}
  fw_hq: {label: "Firewall HQ HA - Runtime Active Abstraction", type: firewall, site: hq}
  fw_telesale: {label: "Firewall Branch HA - Runtime Active Abstraction", type: firewall, site: branch}
  internet_zone: {label: "Internet / Partner Service Zone", type: service_edge, site: internet}

collapsed_core_design:
  hq: {runtime_node: core_hq, design_members: [core_dist_hq1, core_dist_hq2], gateway_mode: svi_fhrp, representation: design_metadata}
  branch: {runtime_node: dist_branch, design_members: [core_dist_br1, core_dist_br2], gateway_mode: svi_fhrp_except_vlan93, representation: design_metadata}

edge_design:
  provider_domain:
    label: "Internet ISP / Carrier"
    handoff_layer: "WAN Handoff Layer"
    mode: site_local_logical_provider_demarcation
    circuits:
      hq_primary: {id: isp_hq_1, label: "HQ ISP 1", state: active, color: blue, sites: [hq], representation: design_only, runtime_node: null, runtime_state: design_only, controller_managed: false}
      hq_backup: {id: isp_hq_2, label: "HQ ISP 2", state: standby, color: purple, sites: [hq], representation: design_only, runtime_node: null, runtime_state: design_only, controller_managed: false}
      branch_primary: {id: isp_branch_1, label: "Branch ISP 1", state: active, color: blue, sites: [branch], representation: design_only, runtime_node: null, runtime_state: design_only, controller_managed: false}
      branch_backup: {id: isp_branch_2, label: "Branch ISP 2", state: standby, color: purple, sites: [branch], representation: design_only, runtime_node: null, runtime_state: design_only, controller_managed: false}
  firewalls:
    hq:
      runtime_node: fw_hq
      design_role: ha_pair
      primary_member: fw_hq1
      backup_member: fw_hq2
      inside_node: core_hq
      outside_circuits: [hq_primary, hq_backup]
      representation: design_metadata
      controller_managed: false
      runtime_note: "Mininet uses one nftables namespace as the active HA-cluster abstraction."
    branch:
      runtime_node: fw_telesale
      design_role: ha_pair
      primary_member: fw_br1
      backup_member: fw_br2
      inside_node: dist_branch
      outside_circuits: [branch_primary, branch_backup]
      representation: design_metadata
      controller_managed: false
      runtime_note: "Mininet uses one nftables namespace as the active HA-cluster abstraction."
  ce_pairs:
    hq: {members: [ce_hq1, ce_hq2], primary: ce_hq1, backup: ce_hq2}
    branch: {members: [ce_branch1, ce_branch2], primary: ce_branch1, backup: ce_branch2}
  ipsec:
    runtime_node: ipsec_l3
    design_path: "Firewall HQ -> Internet -> Firewall Branch"
    runtime_path: [fw_hq, ipsec_l3, fw_telesale]
    runtime_mode: routed_tunnel_abstraction_between_firewalls
    cryptographic_ipsec: false
    note: "Lab validates routed intersite reachability through both firewall abstractions, not IKE/IPsec cryptography."

server_zone_design:
  runtime_switch: infra_access
  components:
    dhcp_server: {runtime_node: hdhcp, runtime_kind: infrastructure_service, representation: design_metadata, controller_managed: false}
    dns_server: {runtime_node: hdns, runtime_kind: infrastructure_service, representation: design_metadata, controller_managed: false}
    ad_server: {runtime_node: had, runtime_kind: infrastructure_service, representation: design_metadata, controller_managed: false}
    file_server: {runtime_node: hfile, runtime_kind: infrastructure_service, representation: design_metadata, controller_managed: false}
    monitoring_nms: {runtime_node: hmonitor, runtime_kind: infrastructure_service, representation: design_metadata, controller_managed: false}
    backup_server: {runtime_node: hbackup, runtime_kind: infrastructure_service, representation: design_metadata, controller_managed: false}
  partner_services:
    crm: {runtime_node: hcall, representation: partner_external}
    pbx_contact_center: {runtime_node: h90, representation: partner_external}

