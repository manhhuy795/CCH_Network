transit_addressing:
  prefix_length: 30
  rationale: "Moi routed transit dung /30 rieng de de kiem tra trong Mininet; VLAN 93 khong duoc routed qua IPsec."

provider_handoff_paths:
  primary:
    provider_id: site_local_primary_role
    handoff_id: wan_handoff_primary
    label: "Site-local ISP Primary role"
    state: active
    color: blue
    representation: design_only
    runtime_node: null
    runtime_state: design_only
    controller_managed: false
    note: "HQ va Branch co circuit Primary rieng; object nay chi la role chung, khong phai mot circuit vat ly dung chung."
    site_firewalls:
      hq: {firewall: fw_hq, runtime_link: fw_hq_to_internet_zone}
      branch: {firewall: fw_telesale, runtime_link: fw_branch_to_internet_zone}
  backup:
    provider_id: site_local_backup_role
    handoff_id: wan_handoff_backup
    label: "Site-local ISP Backup role"
    state: standby
    color: purple
    representation: design_only
    runtime_node: null
    runtime_state: design_only
    controller_managed: false
    note: "HQ va Branch co circuit Backup rieng; object nay chi la role chung, khong phai mot circuit vat ly dung chung."
    site_firewalls:
      hq: {firewall: fw_hq, runtime_link: fw_hq_to_internet_zone}
      branch: {firewall: fw_telesale, runtime_link: fw_branch_to_internet_zone}

links:
  hq_l3_to_fw_hq:
    site: hq
    role: firewall_inside
    cidr: 10.10.254.0/30
    endpoint_a: {node: hq_l3_gateway, interface: hq-fw, ip: 10.10.254.1}
    endpoint_b: {node: fw_hq, interface: inside, ip: 10.10.254.2}
  fw_hq_to_ipsec:
    site: wan
    role: ipsec_tunnel_hq
    cidr: 10.255.20.0/30
    endpoint_a: {node: fw_hq, interface: tunnel, ip: 10.255.20.1}
    endpoint_b: {node: ipsec_l3, interface: ipsec-hq, ip: 10.255.20.2}
  ipsec_to_fw_branch:
    site: wan
    role: ipsec_tunnel_branch
    cidr: 10.255.20.4/30
    endpoint_a: {node: ipsec_l3, interface: ipsec-br, ip: 10.255.20.5}
    endpoint_b: {node: fw_telesale, interface: tunnel, ip: 10.255.20.6}
  branch_l3_to_fw_branch:
    site: branch
    role: firewall_inside
    cidr: 10.20.254.0/30
    endpoint_a: {node: telesale_l3_gateway, interface: br-fw, ip: 10.20.254.1}
    endpoint_b: {node: fw_telesale, interface: inside, ip: 10.20.254.2}
  fw_hq_to_internet_zone:
    site: hq
    role: firewall_outside
    cidr: 10.255.10.0/30
    endpoint_a: {node: fw_hq, interface: outside, ip: 10.255.10.1}
    endpoint_b: {node: internet_zone, interface: inet-hq, ip: 10.255.10.2}
  fw_branch_to_internet_zone:
    site: branch
    role: firewall_outside
    cidr: 10.255.10.4/30
    endpoint_a: {node: fw_telesale, interface: outside, ip: 10.255.10.5}
    endpoint_b: {node: internet_zone, interface: inet-branch, ip: 10.255.10.6}

service_zone:
  addressing_model: interface_plus_service_vip
  cidr: 10.255.30.0/24
  gateway_node: internet_zone
  gateway_ip: 10.255.30.1
  service_nodes: [h90, hcall, hzalo, hsocial, hinternet]

dhcp_relay:
  server_ip: 10.10.100.10
  hq_vlans: [93, 101, 103, 104, 110, 120, 140]
  branch_vlans: [50]
  note: "VLAN 93 relay is configured only on the HQ SVI because Branch has no VLAN 93 SVI."

routes:
  hq_l3_gateway:
    default_route: {next_hop: 10.10.254.2, description: "HQ local Internet breakout via firewall HA abstraction"}
    user_routes:
      - {prefix: 10.20.50.0/24, next_hop: 10.10.254.2, transport: firewall_ipsec_l3_logic}
  telesale_l3_gateway:
    default_route: {next_hop: 10.20.254.2, description: "Branch local Internet breakout via firewall HA abstraction"}
    user_routes:
      - {prefix: 10.10.100.0/24, next_hop: 10.20.254.2, transport: firewall_ipsec_l3_logic}
      - {prefix: 10.10.101.0/24, next_hop: 10.20.254.2, transport: firewall_ipsec_l3_logic}
      - {prefix: 10.10.103.0/24, next_hop: 10.20.254.2, transport: firewall_ipsec_l3_logic}
      - {prefix: 10.10.104.0/24, next_hop: 10.20.254.2, transport: firewall_ipsec_l3_logic}
      - {prefix: 10.10.110.0/24, next_hop: 10.20.254.2, transport: firewall_ipsec_l3_logic}
      - {prefix: 10.10.120.0/24, next_hop: 10.20.254.2, transport: firewall_ipsec_l3_logic}
      - {prefix: 10.10.140.0/24, next_hop: 10.20.254.2, transport: firewall_ipsec_l3_logic}
  fw_hq:
    default_route: {next_hop: 10.255.10.2}
    inside_routes:
      - 10.10.93.0/24
      - 10.10.100.0/24
      - 10.10.101.0/24
      - 10.10.103.0/24
      - 10.10.104.0/24
      - 10.10.110.0/24
      - 10.10.120.0/24
      - 10.10.140.0/24
    inside_next_hop: 10.10.254.1
    tunnel_routes: [10.20.50.0/24]
    tunnel_next_hop: 10.255.20.2
  fw_telesale:
    default_route: {next_hop: 10.255.10.6}
    inside_routes: [10.20.50.0/24]
    inside_next_hop: 10.20.254.1
    tunnel_routes:
      - 10.10.100.0/24
      - 10.10.101.0/24
      - 10.10.103.0/24
      - 10.10.104.0/24
      - 10.10.110.0/24
      - 10.10.120.0/24
      - 10.10.140.0/24
    tunnel_next_hop: 10.255.20.5
  ipsec_l3:
    cryptographic_ipsec: false
    runtime_mode: routed_tunnel_abstraction_between_firewalls
    hq_routes:
      - 10.10.100.0/24
      - 10.10.101.0/24
      - 10.10.103.0/24
      - 10.10.104.0/24
      - 10.10.110.0/24
      - 10.10.120.0/24
      - 10.10.140.0/24
    hq_next_hop: 10.255.20.1
    branch_routes: [10.20.50.0/24]
    branch_next_hop: 10.255.20.6

l2vpn_services:
  vlan93_project_2:
    service_type: vpws
    customer_vlan: 93
    routed_advertisement: false
    gateway_owner: core_hq
    gateway_site: hq
    primary_path: [ce_hq1, l2vpn_primary, ce_branch1]
    backup_path: [ce_hq2, l2vpn_backup, ce_branch2]
    primary_state: active
    backup_state: standby
