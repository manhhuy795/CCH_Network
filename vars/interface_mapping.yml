interfaces:
  hq-access-a:
    access_ports:
      - {range: GigabitEthernet1/0/1-20, description: "Project 1", vlan: 101}
      - {range: GigabitEthernet1/0/21-30, description: "Project 2 - HQ runtime sample", vlan: 93}
      - {range: GigabitEthernet1/0/31-35, description: "HQ IoT / Camera / Printer / UPS", vlan: 140}
      - {range: GigabitEthernet1/0/36-37, description: "Guest HQ", vlan: 120}
    uplink: {name: Port-channel1, description: "Logical dual-uplink to HQ collapsed Core/Distribution pair", allowed_vlans: [93, 101, 120, 140]}
  hq-access-b:
    access_ports:
      - {range: GigabitEthernet1/0/1-20, description: "Project 3", vlan: 103}
      - {range: GigabitEthernet1/0/21-40, description: "Project 4", vlan: 104}
      - {range: GigabitEthernet1/0/41-48, description: "Office / IT Support", vlan: 110}
    uplink: {name: Port-channel1, description: "Logical dual-uplink to HQ collapsed Core/Distribution pair", allowed_vlans: [103, 104, 110]}
  hq-infra-access:
    access_ports:
      - {range: GigabitEthernet1/0/1-24, description: "Server Farm: AD/DNS/DHCP/File/NMS/Backup", vlan: 100}
    uplink: {name: Port-channel1, description: "Logical dual-uplink to HQ collapsed Core/Distribution pair", allowed_vlans: [100]}
  hq-core-dist:
    trunks:
      - {name: Port-channel11, description: "To HQ Access A", allowed_vlans: [93, 101, 120, 140]}
      - {name: Port-channel12, description: "To HQ Access B", allowed_vlans: [103, 104, 110]}
      - {name: Port-channel13, description: "To Server/Infrastructure Access", allowed_vlans: [100]}
      - {name: GigabitEthernet1/0/41, description: "VLAN 93 primary L2 handoff to CE-HQ1", allowed_vlans: [93]}
      - {name: GigabitEthernet1/0/42, description: "VLAN 93 backup L2 handoff to CE-HQ2", allowed_vlans: [93]}
    routed:
      - {name: GigabitEthernet1/0/47, description: "Logical IPsec L3 tunnel handoff", ip: 10.255.20.1/30}
      - {name: GigabitEthernet1/0/48, description: "Inside to HQ firewall HA", ip: 10.10.254.1/30}
  hq-ce1:
    l2vpn:
      customer: {name: GigabitEthernet0/0, description: "VLAN 93 L2 handoff from HQ Core-Dist", vlan: 93}
      provider: {name: GigabitEthernet0/1, description: "MPLS L2VPN Primary attachment circuit", service: primary}
  hq-ce2:
    l2vpn:
      customer: {name: GigabitEthernet0/0, description: "VLAN 93 L2 handoff from HQ Core-Dist", vlan: 93}
      provider: {name: GigabitEthernet0/1, description: "MPLS L2VPN Backup attachment circuit", service: backup}
  hq-firewall-ha:
    routed:
      - {name: inside, description: "Inside to HQ Core-Dist", ip: 10.10.254.2/30}
      - {name: outside, description: "Outside to Internet service zone", ip: 10.255.10.1/30}

  br-access:
    access_ports:
      - {range: GigabitEthernet1/0/1-10, description: "Project 2 - Branch runtime sample", vlan: 93}
      - {range: GigabitEthernet1/0/11-20, description: "Branch IoT", vlan: 50}
    uplink: {name: Port-channel1, description: "Logical dual-uplink to Branch collapsed Core/Distribution pair", allowed_vlans: [50, 93]}
  br-core-dist:
    trunks:
      - {name: Port-channel11, description: "To Branch Access", allowed_vlans: [50, 93]}
      - {name: GigabitEthernet1/0/41, description: "VLAN 93 primary L2 handoff to CE-BR1", allowed_vlans: [93]}
      - {name: GigabitEthernet1/0/42, description: "VLAN 93 backup L2 handoff to CE-BR2", allowed_vlans: [93]}
    routed:
      - {name: GigabitEthernet1/0/47, description: "Logical IPsec L3 tunnel handoff", ip: 10.255.20.6/30}
      - {name: GigabitEthernet1/0/48, description: "Inside to Branch firewall HA", ip: 10.20.254.1/30}
    no_svi_vlans: [93]
  br-ce1:
    l2vpn:
      customer: {name: GigabitEthernet0/0, description: "VLAN 93 L2 handoff from Branch Core-Dist", vlan: 93}
      provider: {name: GigabitEthernet0/1, description: "MPLS L2VPN Primary attachment circuit", service: primary}
  br-ce2:
    l2vpn:
      customer: {name: GigabitEthernet0/0, description: "VLAN 93 L2 handoff from Branch Core-Dist", vlan: 93}
      provider: {name: GigabitEthernet0/1, description: "MPLS L2VPN Backup attachment circuit", service: backup}
  br-firewall-ha:
    routed:
      - {name: inside, description: "Inside to Branch Core-Dist", ip: 10.20.254.2/30}
      - {name: outside, description: "Outside to Internet service zone", ip: 10.255.10.5/30}
